name: Retired upstream release workflow

# Las revisiones antiguas aún publican: desactivar este workflow en el repositorio antes de crear tags.
'on':
  push:
    branches:
      - release/fork-hacs-prep
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the retired release path
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          echo 'This workflow no longer builds or publishes fork releases.'
          echo 'Use fork-release.yml after separately approving the candidate and repository safeguards.'
          echo 'Older revisions retain the original publisher; disable this workflow repository-wide before any v* tag.'
          if [[ "$EVENT_REF" == refs/tags/* ]]; then
            exit 1
          fi
