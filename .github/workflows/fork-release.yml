name: Fork release preflight and publication

'on':
  push:
    branches:
      - release/fork-hacs-prep
      - ben/tucompra
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version for a non-publishing preflight
        required: true
        default: '2026.10.1'
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate exact candidate and release ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      zip_sha256: ${{ steps.preflight.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install release validation dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Run non-publishing preflight
        id: preflight
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.version || vars.FORK_RELEASE_PREFLIGHT_VERSION || '2026.10.1' }}
          FORK_RELEASE_APPROVED_SHA: ${{ vars.FORK_RELEASE_APPROVED_SHA }}
          FORK_RELEASE_APPROVED_VERSION: ${{ vars.FORK_RELEASE_APPROVED_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$REQUESTED_VERSION"
          tag_args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag_args=(--tag-event)
          fi
          python scripts/release_preflight.py \
            --source-sha "$CANDIDATE_SHA" \
            --version "$version" \
            --output "$RUNNER_TEMP/release-artifacts" \
            "${tag_args[@]}"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-artifacts' / 'release-report.json').read_text())
          digest = report['zip_sha256']
          if not isinstance(digest, str) or re.fullmatch(r'[0-9a-f]{64}', digest) is None:
              raise SystemExit('Preflight report has no valid ZIP SHA-256')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'zip_sha256={digest}\n')
          PY
      - name: Keep validated package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: fork-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-artifacts/tucompra.zip
            ${{ runner.temp }}/release-artifacts/release-report.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish approved and validated tag
    needs: preflight
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: fork-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts
      - name: Recheck gates and publish the existing artifact
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_ZIP_SHA256: ${{ needs.preflight.outputs.zip_sha256 }}
          FORK_RELEASE_APPROVED_SHA: ${{ vars.FORK_RELEASE_APPROVED_SHA }}
          FORK_RELEASE_APPROVED_VERSION: ${{ vars.FORK_RELEASE_APPROVED_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_publish.py \
            --source-sha "$CANDIDATE_SHA" \
            --version "${GITHUB_REF_NAME#v}" \
            --artifacts "$RUNNER_TEMP/release-artifacts" \
            --expected-zip-sha "$EXPECTED_ZIP_SHA256" \
            --publish
